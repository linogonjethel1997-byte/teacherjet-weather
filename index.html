<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Jet's Class</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
overflow:hidden;
background:#dff6ff;
}

.page{
display:none;
width:100vw;
height:100vh;
position:relative;
background-size:cover;
background-position:center;
overflow:hidden;
}

.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.main-page{
background-image:url("background.png");
}

.title{
font-size:55px;
font-weight:bold;
color:#ff4f81;
text-shadow:3px 3px white;
margin-bottom:25px;
text-align:center;
}

.main-buttons{
display:grid;
grid-template-columns:repeat(2, 320px);
gap:20px;
}

.big-btn{
padding:20px;
font-size:30px;
font-weight:bold;
border:none;
border-radius:25px;
background:white;
cursor:pointer;
box-shadow:0 5px 10px rgba(0,0,0,0.2);
transition:0.3s;
}

.big-btn:hover{
transform:scale(1.05);
}

.back-btn{
position:absolute;
top:15px;
left:15px;
width:90px;
cursor:pointer;
z-index:999;
}

.center-image{
max-width:85%;
max-height:82%;
object-fit:contain;
}

.review-grid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:15px;
width:72%;
max-width:850px;
}

.review-grid img{
width:100%;
height:190px;
object-fit:cover;
border-radius:20px;
border:5px solid white;
}

.answer-btn{
width:220px;
margin-top:18px;
cursor:pointer;
}

.answer-box{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.answer-box img{
width:300px;
height:300px;
object-fit:contain;
}

.answer-text{
font-size:50px;
font-weight:bold;
margin-top:10px;
color:#ff4f81;
}

.congrats{
width:420px;
}

.wheel{
width:220px;
cursor:pointer;
transition:transform 1s;
}

.spin{
transform:rotate(1080deg);
}

.emotions-grid{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:20px;
margin-top:20px;
}

.emotion-card{
background:white;
padding:10px;
border-radius:20px;
cursor:pointer;
text-align:center;
}

.emotion-card img{
width:160px;
height:160px;
object-fit:contain;
}

.emotion-name{
display:none;
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.sentence-page{
background-image:url("kids.png");
}

.split{
display:flex;
width:100%;
height:100%;
padding-top:60px;
}

.section{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:12px;
}

.pattern{
font-size:38px;
font-weight:bold;
background:rgba(255,255,255,0.85);
padding:10px 20px;
border-radius:20px;
color:black;
}

.result-box{
width:300px;
height:250px;
background:rgba(255,255,255,0.92);
border-radius:25px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.result-box img{
width:160px;
height:160px;
object-fit:contain;
}

.result-text{
font-size:35px;
font-weight:bold;
margin-top:10px;
}

.reset-btn{
padding:12px 28px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:20px;
cursor:pointer;
background:#ffda77;
}

.roleplay-page{
background-image:url("roleplay.png");
}

.role-title{
font-size:70px;
font-weight:bold;
color:white;
text-shadow:4px 4px black;
margin-bottom:40px;
}

.start-btn{
width:280px;
cursor:pointer;
}

.level-buttons{
display:flex;
gap:25px;
}

.level-btn{
padding:20px 40px;
font-size:34px;
font-weight:bold;
border:none;
border-radius:25px;
cursor:pointer;
}

.role-layout{
display:flex;
width:95%;
height:90%;
justify-content:space-between;
align-items:center;
padding-top:60px;
}

.dialogue-box{
width:65%;
height:85%;
background:rgba(255,255,255,0.93);
border-radius:25px;
padding:12px;
display:flex;
flex-direction:column;
justify-content:center;
gap:7px;
}

.lineA,
.lineB{
padding:8px;
border-radius:15px;
font-weight:bold;
display:flex;
align-items:center;
font-size:20px;
}

.lineA{
background:#8dff8d;
}

.lineB{
background:#ff9c9c;
}

.character{
width:60px;
height:60px;
object-fit:contain;
margin-right:10px;
}

.side-wheel{
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
}

.role-result{
width:260px;
height:240px;
background:white;
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.role-result img{
width:150px;
height:150px;
object-fit:contain;
}

</style>
</head>

<body>

<!-- MAIN PAGE -->

<div class="page active main-page" id="mainPage">

<div class="title">
Welcome to Teacher Jet's Class!
</div>

<div class="main-buttons">

<button class="big-btn" onclick="showPage('rulesPage')">
RULES
</button>

<button class="big-btn" onclick="startReview()">
REVIEW
</button>

<button class="big-btn" onclick="showPage('emotionPage')">
EMOTIONS
</button>

<button class="big-btn" onclick="showPage('sentencePage')">
SENTENCE PATTERN
</button>

<button class="big-btn"
style="grid-column:1/3;"
onclick="showPage('roleplayPage')">
ROLE PLAY
</button>

</div>

</div>

<!-- RULES -->

<div class="page" id="rulesPage">

<img src="back.png"
class="back-btn"
onclick="showPage('mainPage')">

<img src="rules.png"
class="center-image">

</div>

<!-- REVIEW -->

<div class="page" id="reviewPage">

<img src="back.png"
class="back-btn"
onclick="showPage('mainPage')">

<h1 id="reviewTitle"
class="title"></h1>

<div class="review-grid"
id="reviewGrid"></div>

<img src="answer.png"
class="answer-btn"
onclick="showAnswer()">

</div>

<!-- ANSWER PAGE -->

<div class="page" id="answerPage">

<div class="answer-box">

<img id="answerGif">

<div id="answerText"
class="answer-text"></div>

<button class="big-btn"
onclick="nextQuestion()">
NEXT
</button>

</div>

</div>

<!-- CONGRATS -->

<div class="page" id="congratsPage">

<img src="back.png"
class="back-btn"
onclick="showPage('mainPage')">

<img src="congrats.gif"
class="congrats">

<h1 class="title">6 / 6</h1>

</div>

<!-- EMOTIONS -->

<div class="page" id="emotionPage">

<img src="back.png"
class="back-btn"
onclick="showPage('mainPage')">

<img src="wheel.png"
class="wheel"
onclick="showEmotions()">

<div class="emotions-grid"
id="emotionGrid"></div>

</div>

<!-- SENTENCE PATTERN -->

<div class="page sentence-page"
id="sentencePage">

<img src="back.png"
class="back-btn"
onclick="showPage('mainPage')">

<div class="split">

<!-- WEATHER -->

<div class="section">

<div class="pattern">
The weather today is...
</div>

<img src="weatherwheel.png"
class="wheel"
onclick="spinWeather(this,'weatherResult')">

<div class="result-box"
id="weatherResult"></div>

<button class="reset-btn"
onclick="resetBox('weatherResult')">
RESET
</button>

</div>

<!-- EMOTIONS -->

<div class="section">

<div class="pattern">
I am feeling...
</div>

<img src="emotions.png"
class="wheel"
onclick="spinEmotion(this,'emotionResult')">

<div class="result-box"
id="emotionResult"></div>

<button class="reset-btn"
onclick="resetBox('emotionResult')">
RESET
</button>

</div>

</div>

</div>

<!-- ROLEPLAY PAGE -->

<div class="page roleplay-page"
id="roleplayPage">

<img src="back.png"
class="back-btn"
onclick="showPage('mainPage')">

<div class="role-title">
ROLE PLAY
</div>

<img src="start.png"
class="start-btn"
onclick="showPage('levelPage')">

</div>

<!-- LEVEL PAGE -->

<div class="page"
id="levelPage">

<img src="back.png"
class="back-btn"
onclick="showPage('roleplayPage')">

<h1 class="title">
Choose Difficulty
</h1>

<div class="level-buttons">

<button class="level-btn"
onclick="openRole('easy')">
EASY
</button>

<button class="level-btn"
onclick="openRole('medium')">
MEDIUM
</button>

<button class="level-btn"
onclick="openRole('hard')">
HARD
</button>

</div>

</div>

<!-- ROLE CONTENT -->

<div class="page"
id="roleContent">

<img src="back.png"
class="back-btn"
onclick="showPage('levelPage')">

<div class="role-layout">

<div class="dialogue-box"
id="dialogueBox"></div>

<div class="side-wheel">

<img src="weatherwheel.png"
class="wheel"
onclick="spinWeather(this,'roleWeather')">

<div class="role-result"
id="roleWeather"></div>

</div>

</div>

</div>

<script>

function showPage(id){

document.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

}

const reviews = [

{
name:"SUNNY",
gif:"sunny.gif",
pics:["sunny2.png","sunny3.png","sunny4.png","sunny5.png"]
},

{
name:"RAINY",
gif:"rainy.gif",
pics:["rainy2.png","rainy3.png","rainy4.png","rainy5.png"]
},

{
name:"CLOUDY",
gif:"cloudy.gif",
pics:["cloudy2.png","cloudy3.png","cloudy4.png","cloudy5.png"]
},

{
name:"WINDY",
gif:"windy.gif",
pics:["windy2.png","windy3.png","windy4.png","windy5.png"]
},

{
name:"STORMY",
gif:"stormy.gif",
pics:["stormy2.png","stormy3.png","stormy4.png","stormy5.png"]
},

{
name:"SNOWY",
gif:"snowy.gif",
pics:["snowy2.png","snowy3.png","snowy4.png","snowy5.png"]
}

];

let currentQuestion = 0;

function startReview(){

currentQuestion = 0;

loadQuestion();

}

function loadQuestion(){

showPage("reviewPage");

let item = reviews[currentQuestion];

document.getElementById("reviewTitle")
.innerHTML =
"Question " + (currentQuestion + 1);

let grid =
document.getElementById("reviewGrid");

grid.innerHTML = "";

item.pics.forEach(pic=>{

grid.innerHTML += `
<img src="${pic}">
`;

});

}

function showAnswer(){

let item = reviews[currentQuestion];

showPage("answerPage");

document.getElementById("answerGif")
.src = item.gif;

document.getElementById("answerText")
.innerHTML = item.name;

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion >= reviews.length){

showPage("congratsPage");

}else{

loadQuestion();

}

}

const emotions = [

{name:"ANGRY",gif:"angry.gif"},
{name:"HAPPY",gif:"happy.gif"},
{name:"SCARED",gif:"scared.gif"},
{name:"SLEEPY",gif:"sleepy.gif"},
{name:"SAD",gif:"sad.gif"},
{name:"EXCITED",gif:"excited.gif"}

];

function showEmotions(){

let grid =
document.getElementById("emotionGrid");

if(grid.innerHTML !== ""){

grid.innerHTML = "";
return;

}

emotions.forEach(emotion=>{

grid.innerHTML += `

<div class="emotion-card"
onclick="toggleEmotion(this)">

<img src="${emotion.gif}">

<div class="emotion-name">
${emotion.name}
</div>

</div>

`;

});

}

function toggleEmotion(card){

let name =
card.querySelector(".emotion-name");

if(name.style.display === "block"){

name.style.display = "none";

}else{

name.style.display = "block";

}

}

const weathers = [

{name:"SUNNY",gif:"sunny.gif"},
{name:"RAINY",gif:"rainy.gif"},
{name:"CLOUDY",gif:"cloudy.gif"},
{name:"WINDY",gif:"windy.gif"},
{name:"STORMY",gif:"stormy.gif"},
{name:"SNOWY",gif:"snowy.gif"}

];

function spinWeather(wheel,id){

wheel.classList.add("spin");

setTimeout(()=>{

wheel.classList.remove("spin");

let item =
weathers[Math.floor(
Math.random()*weathers.length
)];

document.getElementById(id)
.innerHTML = `

<img src="${item.gif}">

<div class="result-text">
${item.name}
</div>

`;

},1000);

}

function spinEmotion(wheel,id){

wheel.classList.add("spin");

setTimeout(()=>{

wheel.classList.remove("spin");

let item =
emotions[Math.floor(
Math.random()*emotions.length
)];

document.getElementById(id)
.innerHTML = `

<img src="${item.gif}">

<div class="result-text">
${item.name}
</div>

`;

},1000);

}

function resetBox(id){

document.getElementById(id)
.innerHTML = "";

}

function openRole(level){

showPage("roleContent");

let box =
document.getElementById("dialogueBox");

if(level === "easy"){

box.innerHTML = `

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
What is the weather today?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
Today is...
</div>

`;

}

if(level === "medium"){

box.innerHTML = `

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
What is the weather today?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
Today is...
</div>

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
How do you feel?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
I am feeling...
</div>

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
What is your favorite weather?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
My favorite weather is...
</div>

`;

}

if(level === "hard"){

box.innerHTML = `

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
What is the weather today?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
Today is...
</div>

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
How do you feel?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
I am feeling...
</div>

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
What is your favorite weather?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
My favorite weather is...
</div>

<div class="lineA">
<img src="girl.gif"
class="character">
Student A:
Why do you like it?
</div>

<div class="lineB">
<img src="boy.gif"
class="character">
Student B:
Because...
</div>

`;

}

}

</script>

</body>
</html>
